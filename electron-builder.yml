appId: io.bingdu.reader
productName: JSR
directories:
  output: build/desktop-release
asar: true
afterPack: scripts/embed_windows_icon.cjs
electronDist: node_modules/electron/dist
files:
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/loading.html
  - package.json
extraResources:
  - from: build/legal
    to: legal
  - from: LICENSE
    to: LICENSE
  - from: COPYRIGHT
    to: COPYRIGHT
  - from: NOTICE.md
    to: NOTICE.md
  - from: build/desktop-backend/bingdu-service
    to: backend
  - from: assets/jsr-empty.ico
    to: jsr-empty.ico
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
win:
  icon: assets/jsr-empty.ico
  target:
    - target: nsis
      arch: [x64]
  # The afterPack hook edits resources locally; no signing certificate is configured.
  signAndEditExecutable: false
nsis:
  installerIcon: assets/jsr-empty.ico
  uninstallerIcon: assets/jsr-empty.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: JSR-${version}-Setup.${ext}
